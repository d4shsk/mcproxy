# Публичный IP российского TCP-релея. Forwarding принимается только от него.
trusted-relay-ip=RELAY_PUBLIC_IP

# Должен полностью совпадать с forwarding-secret в relay.properties релея.
forwarding-secret=CHANGE_ME_TO_A_RANDOM_SECRET_OF_AT_LEAST_32_BYTES

# Допустимое расхождение часов proxy/backend и срок действия подписи.
signature-max-age-seconds=300

# Minecraft-адреса, вводимые игроками для входа через российский релей.
# Дополнительные IP/домены можно перечислить через запятую.
proxy-game-hosts=RELAY_PUBLIC_IP,proxy.example.com

# Адреса Simple Voice Chat, выдаваемые отдельно для каждого игрока.
proxy-voice-host=RELAY_PUBLIC_IP:25794
direct-voice-host=BACKEND_IP:26289
